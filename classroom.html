<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16212C">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light only">
<style>:root{color-scheme:light only;}</style>
<title>2026년 중화고 학생별 교실 검색기</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap');
html,body{margin:0;padding:0;}
.jh{--ink:#16212C;--mut:#5F7082;--rule:#D3DBE3;--wash:#F2F5F8;--mark:#FFE45C;
 --room:#0F4C81;--warn:#A8451E;
 font-family:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",
 "Noto Sans KR",-apple-system,sans-serif;
 color:var(--ink);background:var(--wash);min-height:100vh;
 font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;
 font-synthesis:none;font-synthesis-weight:none;}
.jh *{box-sizing:border-box;}
.jh-wrap{max-width:620px;margin:0 auto;padding:0 12px 56px;}

.jh-head{background:var(--ink);color:#fff;margin:0 -12px;padding:16px 16px 14px;}
.jh-head-in{max-width:620px;margin:0 auto;display:flex;align-items:flex-end;
 justify-content:space-between;gap:10px;flex-wrap:wrap;}
.jh-title{font-size:26px;font-weight:400;letter-spacing:0;margin:0;line-height:1.3;}
.jh-by{font-size:14px;color:#9FB1C2;white-space:nowrap;}
.jh-clock{max-width:620px;margin:10px auto 0;font-size:15px;color:#B9C8D6;}
.jh-clock b{color:var(--mark);font-weight:700;}

.jh-box{background:#fff;border:1px solid var(--rule);border-radius:10px;margin-top:12px;padding:12px;}
.jh-in{width:100%;padding:14px 13px;font-size:18px;border:1.5px solid var(--rule);
 border-radius:8px;font-family:inherit;color:var(--ink);background:#fff;}
.jh-in:focus{outline:none;border-color:var(--ink);}
.jh-lbl{font-size:14px;color:var(--mut);margin:0 0 6px;font-weight:700;}

.jh-hits{list-style:none;margin:8px 0 0;padding:0;max-height:250px;overflow:auto;
 border-top:1px solid var(--wash);}
.jh-hit{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:none;
 border:0;border-bottom:1px solid var(--wash);padding:13px 2px;cursor:pointer;font-family:inherit;
 font-size:17px;color:var(--ink);}
.jh-hit:hover{background:var(--wash);}
.jh-hit b{font-weight:700;}
.jh-hit span{color:var(--mut);font-size:15px;}
.jh-hit i{margin-left:auto;font-style:normal;font-size:15px;font-weight:700;color:var(--room);}

.jh-now{background:#fff;border:1px solid var(--rule);border-radius:10px;margin-top:12px;
 padding:16px;border-left:5px solid var(--mark);}
.jh-who{font-size:15px;color:var(--mut);margin:0 0 7px;}
.jh-who b{color:var(--ink);font-size:21px;font-weight:800;margin-right:6px;}
.jh-room{font-size:37px;font-weight:800;letter-spacing:-.02em;color:var(--room);line-height:1.15;}
.jh-sub{font-size:18px;margin-top:5px;}
.jh-tea{font-size:15px;color:var(--mut);margin-top:2px;}
.jh-off{font-size:23px;font-weight:700;color:var(--mut);}

.jh-pick{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;align-items:center;}
.jh-seg{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:#fff;}
.jh-seg button{background:transparent;border:0;color:var(--mut);padding:9px 13px;font-size:15px;
 cursor:pointer;font-family:inherit;font-weight:600;}
.jh-seg button[data-on="1"]{background:var(--ink);color:#fff;}
.jh-reset{background:none;border:0;color:var(--room);font:inherit;font-size:14px;
 text-decoration:underline;cursor:pointer;padding:4px;}

table.jh-tt{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:12px;
 background:#fff;border:1px solid var(--rule);border-radius:10px;overflow:hidden;}
.jh-tt th,.jh-tt td{border:1px solid var(--rule);padding:0;vertical-align:middle;overflow:hidden;}
.jh-tt thead th{background:var(--ink);color:#fff;font-size:15px;font-weight:400;padding:9px 2px;}
.jh-tt thead th:first-child{width:44px;}
.jh-tt td.jh-pcell{background:var(--wash);text-align:center;padding:4px 1px;}
.jh-pn{font-size:14px;font-weight:400;}
.jh-pt{font-size:11px;color:var(--mut);display:block;margin-top:1px;}
.jh-cell{padding:5px 2px;text-align:center;line-height:1.28;min-height:60px;}
.jh-c1{font-size:13px;font-weight:400;}
.jh-c2{font-size:12px;color:var(--mut);margin-top:1px;}
.jh-c3{font-size:14.5px;font-weight:400;color:var(--room);margin-top:3px;}
.jh-tt td[data-now="1"]{background:var(--mark);box-shadow:inset 0 0 0 2px var(--ink);}
.jh-tt td[data-now="1"] .jh-c2{color:#5A4A12;}
.jh-tt td[data-now="1"] .jh-c3{color:var(--ink);}
.jh-tt td[data-kind="hr"] .jh-c3{color:var(--mut);}
.jh-tt td[data-kind="out"]{background:repeating-linear-gradient(-45deg,#fff,#fff 5px,#F4F7FA 5px,#F4F7FA 10px);}
.jh-out{font-size:13px;font-weight:400;color:var(--mut);}
.jh-chk{color:var(--warn);font-weight:800;}

.jh-note{font-size:14px;line-height:1.6;color:var(--mut);margin-top:12px;padding:0 2px;}
.jh-map{margin-top:14px;background:#fff;border:1px solid var(--rule);border-radius:10px;
 overflow:hidden;}
.jh-map-h{padding:11px 14px;border-bottom:1px solid var(--rule);font-size:15px;font-weight:700;
 display:flex;justify-content:space-between;align-items:center;}
.jh-map-h span{font-weight:400;font-size:13px;color:var(--mut);}
.jh-map-b{overflow:auto;-webkit-overflow-scrolling:touch;}
.jh-map-b img{display:block;width:100%;min-width:760px;height:auto;image-rendering:auto;}
.jh-modal{position:fixed;inset:0;background:rgba(10,16,22,.92);z-index:99;overflow:auto;
 -webkit-overflow-scrolling:touch;}
.jh-modal img{display:block;width:auto;max-width:none;}
.jh-close{position:fixed;top:12px;right:12px;z-index:100;background:#fff;border:0;
 border-radius:8px;padding:10px 16px;font-size:16px;font-weight:700;font-family:inherit;
 color:var(--ink);cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.35);}
.jh-empty{text-align:center;padding:36px 14px;color:var(--mut);font-size:16px;line-height:1.7;}
@media (max-width:400px){ .jh-room{font-size:31px;} }

.jh-extin{font-size:16px;color:var(--room);white-space:nowrap;}
.jh-ext{font-size:16px;color:var(--room);margin-top:3px;}
.jh-map-b{overflow:hidden;}
.jh-map-b img{width:100%;min-width:0;height:auto;cursor:zoom-in;}
.jh-modal img{cursor:zoom-out;}
.jh-c1,.jh-c2,.jh-c3,.jh-c4,.jh-out{white-space:nowrap;overflow:hidden;display:block;}
.jh-c4{font-size:11.5px;color:var(--room);line-height:1.15;margin-top:1px;}
.jh-tt td[data-now="1"] .jh-c4{color:var(--ink);}
@media (max-width:520px){
 .jh-wrap{padding-left:7px;padding-right:7px;}
 .jh-head{margin-left:-7px;margin-right:-7px;}
 .jh-tabs{margin-left:-7px;margin-right:-7px;}
 .jh-tt thead th:first-child{width:34px;}
 .jh-cell{padding:4px 1px;}
}

</style>
</head>

    <p class="jh-clock" id="clock"></p>

  <main class="jh-wrap">
    <div class="jh-box">

      <input class="jh-in" id="q" placeholder="예: 홍길동 / 30101" inputmode="search" autocomplete="off">
      <ul class="jh-hits" id="hits" hidden></ul>
    </div>
    <div id="panel"></div>
  </main>
</div>
<button class="jh-close" id="close" hidden>닫기</button>
<div class="jh-modal" id="modal" hidden><img id="bigmap" alt="중화고등학교 교실 배치도"></div>

function toMin(s){var a=s.split(":");return +a[0]*60+ +a[1];}
function dayIndexOf(d){return [null,0,1,2,3,4,null][d.getDay()];}
function clockState(now){
  var di=dayIndexOf(now), m=now.getHours()*60+now.getMinutes();
  if(di===null) return {kind:"weekend"};
  for(var i=0;i<PERIODS.length;i++){
    if(m>=toMin(PERIODS[i][1]) && m<toMin(PERIODS[i][2])) return {kind:"in",di:di,pi:i};
  }
  for(var j=0;j<PERIODS.length;j++){ if(toMin(PERIODS[j][1])>m) return {kind:"break",di:di,next:j}; }
  return {kind:"over",di:di};
}
var sel=null, pick=null, now=new Date();
function view(){
  var cs=clockState(now);
  if(pick) return {di:pick.di, pi:pick.pi, live:false, cs:cs};
  return {di: cs.kind==="in"?cs.di:null, pi: cs.kind==="in"?cs.pi:null, live:true, cs:cs};
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function cellAt(gi,di,pi){ var c=GRIDS[gi][di*7+pi]; return c>=0?COURSES[c]:null; }

function renderClock(){
  var v=view(), cs=v.cs, w=["일","월","화","수","목","금","토"][now.getDay()];
  var pad=function(n){return (n<10?"0":"")+n;};
  var tail;
  if(cs.kind==="in") tail='<b>'+PERIODS[cs.pi][0]+'교시</b>';
  else if(cs.kind==="break") tail='쉬는 시간 · '+PERIODS[cs.next][0]+'교시 '+PERIODS[cs.next][1]+' 시작';
  else if(cs.kind==="over") tail='일과 종료';
  else tail='주말';
  document.getElementById("clock").innerHTML =
    (now.getMonth()+1)+'월 '+now.getDate()+'일 '+w+'요일 '+pad(now.getHours())+':'+pad(now.getMinutes())+' · '+tail;
}

function renderHits(){
  var t=document.getElementById("q").value.trim(), ul=document.getElementById("hits");
  if(!t){ ul.hidden=true; ul.innerHTML=""; return; }
  var v=view(), out=[], n=0;
  for(var i=0;i<STUDENTS.length && n<30;i++){
    var s=STUDENTS[i];
    if(s.n.indexOf(t)<0 && s.i.indexOf(t)<0) continue;
    n++;
    var c = v.di!==null ? cellAt(i,v.di,v.pi) : null;
    var where = c ? (c[3]==="out" ? "위탁 학교" : c[2]) : "";
    out.push('<li><button class="jh-hit" data-gi="'+i+'"><b>'+esc(s.n)+'</b>'+
      '<span>'+esc(s.i)+' · '+s.g+'-'+s.k+(s.j?" · 직업위탁":"")+'</span>'+
      '<i>'+esc(where)+'</i></button></li>');
  }
  if(!out.length) out.push('<li style="padding:12px 2px;font-size:15px;color:#5F7082">찾는 학생이 없습니다.</li>');
  ul.innerHTML=out.join(""); ul.hidden=false;
}

function mapHTML(){

    '<span style="font-weight:700;color:var(--ink);font-size:15px">교실 배치도</span>'+
    '<span>눌러서 크게 보기</span></div>'+
    '<div class="jh-map-b"><img id="smallmap" src="'+MAP+'" alt="중화고등학교 교실 배치도"></div></div>';
}

function roomHTML(c){
  if(c[3]==="out") return '<div class="jh-room">위탁 학교</div>';
  var full=c[4]||c[2];
  if(c[4]){
    var m=c[4].match(/^(.*?)\((.*)\)$/);
    var a=m?m[1].trim():c[2], b2=m?m[2].trim():"";
    var ea=EXT[a], eb=EXT[b2];
    if(ea&&eb) return '<div class="jh-room">'+esc(a)+' <span class="jh-extin">(내선번호 : '+ea+')</span></div>'+
                      '<div class="jh-room">'+esc(b2)+' <span class="jh-extin">(내선번호 : '+eb+')</span></div>';
    if(ea) return '<div class="jh-room">'+esc(full)+'</div><div class="jh-ext">'+esc(a)+' (내선번호 : '+ea+')</div>';
    if(eb) return '<div class="jh-room">'+esc(full)+'</div><div class="jh-ext">'+esc(b2)+' (내선번호 : '+eb+')</div>';
    return '<div class="jh-room">'+esc(full)+'</div>';
  }
  var e=EXT[c[2]];
  if(e) return '<div class="jh-room">'+esc(c[2])+' <span class="jh-extin">(내선번호 : '+e+')</span></div>';
  return '<div class="jh-room">'+esc(c[2])+'</div>';
}

  h+='</tr></thead><tbody>';
  for(var pi=0;pi<PERIODS.length;pi++){
    h+='<tr><td class="jh-pcell"><span class="jh-pn">'+PERIODS[pi][0]+'</span><span class="jh-pt">'+PERIODS[pi][1]+'</span></td>';
    for(var di=0;di<DAYS.length;di++){
      var c=cellAt(sel,di,pi), on=(v.di===di && v.pi===pi);
      h+='<td data-now="'+(on?1:0)+'" data-kind="'+(c?c[3]:"")+'">';
      if(c){
        h+='<div class="jh-cell">';
        if(c[3]==="out") h+='<div class="jh-out">'+esc(c[0])+'</div>';
        else{
          h+='<div class="jh-c1">'+esc(c[0])+'</div>';
          if(c[1]) h+='<div class="jh-c2">'+esc(c[1])+'</div>';
          h+='<div class="jh-c3">'+esc(c[2])+'</div>';
          if(c[4]) h+='<div class="jh-c4">'+esc(c[4].slice(c[2].length))+'</div>';
        }
        h+='</div>';
      }
      h+='</td>';
    }
    h+='</tr>';
  }
  h+='</tbody></table>';
  if(stu.j===1) h+='<p class="jh-note">직업위탁 학생입니다. 월요일만 본교에서 별도 수업을 하고, 화~금은 위탁 학교에 있습니다.</p>';
  h+='<p class="jh-note">수요일 5·6교시 창의적 체험활동은 소속 학급 교실로 표시했습니다.</p>';
  h+=mapHTML();
  p.innerHTML=h;
  fitCells();
  requestAnimationFrame(fitCells);
  setTimeout(fitCells,250);
  bindMap();
}

function fitCells(){
  var els=document.querySelectorAll(".jh-tt .jh-c1,.jh-tt .jh-c2,.jh-tt .jh-c3,.jh-tt .jh-c4,.jh-tt .jh-out");
  for(var i=0;i<els.length;i++){
    var e=els[i];
    e.style.fontSize="";
    var avail=e.clientWidth;
    if(!avail) continue;
    var base=parseFloat(getComputedStyle(e).fontSize);
    if(e.scrollWidth>avail){
      var s=Math.max(7.5, base*avail/e.scrollWidth);
      e.style.fontSize=s.toFixed(2)+"px";
      if(e.scrollWidth>e.clientWidth+0.5)
        e.style.fontSize=Math.max(7.5, s*e.clientWidth/e.scrollWidth).toFixed(2)+"px";
    }
  }
}
window.addEventListener("resize", fitCells);
window.addEventListener("orientationchange", function(){ setTimeout(fitCells,200); });
window.addEventListener("load", fitCells);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitCells);

function bindMap(){
  var im=document.getElementById("smallmap");
  if(im) im.onclick=function(){
    document.getElementById("bigmap").src=MAP;
    document.getElementById("modal").hidden=false;
    document.getElementById("close").hidden=false;
  };
}
function closeModal(){
  document.getElementById("modal").hidden=true;
  document.getElementById("close").hidden=true;
}
document.getElementById("close").onclick=closeModal;
document.getElementById("modal").onclick=closeModal;

document.getElementById("q").addEventListener("input", function(){ sel=null; renderHits(); renderPanel(); });
document.getElementById("hits").addEventListener("click", function(e){
  var b=e.target.closest(".jh-hit"); if(!b) return;
  sel=+b.getAttribute("data-gi");
  document.getElementById("q").value="";
  renderHits(); renderPanel();
  window.scrollTo({top:0, behavior:"smooth"});
});
document.getElementById("panel").addEventListener("click", function(e){
  var b=e.target.closest("button"); if(!b) return;
  var v=view();
  if(b.id==="reset"){ pick=null; renderPanel(); return; }
  if(b.hasAttribute("data-d")){ pick={di:+b.getAttribute("data-d"), pi: v.pi===null?0:v.pi}; renderPanel(); renderHits(); return; }
  if(b.hasAttribute("data-p")){ pick={di: v.di===null?0:v.di, pi:+b.getAttribute("data-p")}; renderPanel(); renderHits(); return; }
});
setInterval(function(){ now=new Date(); renderClock(); if(!pick){ renderPanel(); renderHits(); } }, 30000);
renderClock(); renderPanel();
</script>
